<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Sree Vastram Admin</title>
  <meta name="description" content="Sree Vastram admin dashboard — manage products, orders and stock." />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

<div class="dashboard-layout">

  <!-- ═══ SIDEBAR ═══════════════════════════════════════════ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-name">Sree Vastram</div>
      <div class="brand-sub">Admin Panel</div>
    </div>

    <nav class="sidebar-nav">
      <ul>
        <li>
          <a href="#" class="nav-link active" data-section="overview">
            <span class="nav-icon">📊</span> Overview
          </a>
        </li>
        <li>
          <a href="#" class="nav-link" data-section="orders">
            <span class="nav-icon">📦</span> Orders
          </a>
        </li>
        <li>
          <a href="#" class="nav-link" data-section="products">
            <span class="nav-icon">👗</span> Products
          </a>
        </li>
        <li>
          <a href="../index.html" target="_blank">
            <span class="nav-icon">🌐</span> View Store
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <button class="btn-logout" id="logoutBtn">🚪 Logout</button>
    </div>
  </aside>

  <!-- ═══ MAIN CONTENT ═══════════════════════════════════════ -->
  <div class="main-content">

    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-title" id="pageTitle">📊 Overview</div>
      <div class="topbar-info" id="adminInfo">Sree Vastram Admin</div>
    </header>

    <div class="page-content">

      <!-- ── OVERVIEW SECTION ────────────────────────────── -->
      <section class="section active" id="section-overview">
        <div class="stats-grid" id="statsGrid">
          <div class="loader-wrap"><div class="spinner"></div> Loading stats…</div>
        </div>

        <!-- Recent Orders table -->
        <div class="section-header">
          <h2>🕐 Recent Orders</h2>
          <button class="btn btn-outline" onclick="switchSection('orders')">View All →</button>
        </div>
        <div class="table-wrap" id="recentOrdersWrap">
          <div class="loader-wrap"><div class="spinner"></div> Loading…</div>
        </div>
      </section>

      <!-- ── ORDERS SECTION ──────────────────────────────── -->
      <section class="section" id="section-orders">
        <div class="section-header">
          <h2>📦 All Orders</h2>
          <input type="text" class="search-box" id="orderSearch" placeholder="🔍 Search by name / phone…" />
        </div>
        <div class="table-wrap" id="ordersTableWrap">
          <div class="loader-wrap"><div class="spinner"></div> Loading orders…</div>
        </div>
      </section>

      <!-- ── PRODUCTS SECTION ────────────────────────────── -->
      <section class="section" id="section-products">
        <div class="section-header">
          <h2>👗 Products &amp; Stock</h2>
          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <input type="text" class="search-box" id="productSearch" placeholder="🔍 Search products…" />
            <button class="btn btn-add" id="addProductBtn">+ Add Product</button>
          </div>
        </div>
        <div class="table-wrap" id="productsTableWrap">
          <div class="loader-wrap"><div class="spinner"></div> Loading products…</div>
        </div>
      </section>

    </div><!-- /page-content -->
  </div><!-- /main-content -->
</div><!-- /dashboard-layout -->

<!-- ═══ PRODUCT MODAL ══════════════════════════════════════════ -->
<div class="modal-overlay" id="productModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Add Product</h3>
      <button class="modal-close" id="closeModal">✕</button>
    </div>
    <form id="productForm">
      <input type="hidden" id="productId" />

      <div class="grid-2">
        <div class="form-group">
          <label>Product Name *</label>
          <input type="text" id="pName" placeholder="e.g. Silk Saree" required />
        </div>
        <div class="form-group">
          <label>Category *</label>
          <select id="pCategory" required>
            <option value="">Select category</option>
            <option value="cotton">Cotton Suits</option>
            <option value="stitched">Stitched Cotton Suits</option>
            <option value="sarees">Sarees</option>
            <option value="homedecor">Home Decor</option>
            <option value="customised">Customised Jeans</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Price (₹) *</label>
          <input type="number" id="pPrice" placeholder="0.00" min="0" step="0.01" required />
        </div>
        <div class="form-group">
          <label>Stock Quantity *</label>
          <input type="number" id="pStock" placeholder="0" min="0" required />
        </div>
      </div>

      <div class="form-group">
        <label>Image URL</label>
        <input type="url" id="pImage" placeholder="https://…" />
      </div>

      <div class="form-group">
        <label>Colors (comma-separated)</label>
        <input type="text" id="pColors" placeholder="Red, Blue, White" />
      </div>

      <div class="form-group">
        <label>Sizes (comma-separated)</label>
        <input type="text" id="pSizes" placeholder="S, M, L, XL" />
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="pDesc" placeholder="Product description…"></textarea>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="cancelModal">Cancel</button>
        <button type="submit" class="btn btn-add" id="saveProductBtn">Save Product</button>
      </div>
    </form>
  </div>
</div>

<!-- ═══ TOAST CONTAINER ════════════════════════════════════════ -->
<div class="toast-container" id="toastContainer"></div>

<script src="../api.js"></script>
<script src="admin.js"></script>
</body>
</html>
