<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Sree Vastram</title>
    <meta
      name="description"
      content="Login to your Sree Vastram account to track orders and save your details."
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ga+Maamli&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script defer src="script.js"></script>
    <style>
      body {
        background: #fffafc;
        font-family: "Inter", sans-serif;
      }
      .auth-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 160px 16px 40px;
      }
      .auth-box {
        background: #fff;
        border-radius: 20px;
        padding: 2.5rem 2rem;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 8px 40px rgba(179, 0, 89, 0.12);
        border: 1px solid #f2c7d2;
      }
      .auth-brand {
        text-align: center;
        margin-bottom: 1.5rem;
      }
      .auth-brand h1 {
        font-family: "Ga Maamli", sans-serif;
        font-size: 2rem;
        color: #e60073;
        margin-bottom: 0.2rem;
      }
      .auth-brand p {
        color: #999;
        font-size: 0.85rem;
      }
      .auth-title {
        text-align: center;
        font-size: 1.3rem;
        font-weight: 600;
        color: #222;
        margin-bottom: 1.5rem;
      }
      .form-group {
        margin-bottom: 1rem;
      }
      .form-group label {
        display: block;
        font-size: 0.83rem;
        font-weight: 500;
        color: #666;
        margin-bottom: 5px;
      }
      .form-group input {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid #e5b4c6;
        border-radius: 10px;
        font-size: 0.95rem;
        font-family: "Inter", sans-serif;
        outline: none;
        transition:
          border 0.3s,
          box-shadow 0.3s;
        box-sizing: border-box;
      }
      .form-group input:focus {
        border-color: #e60073;
        box-shadow: 0 0 0 3px rgba(230, 0, 115, 0.1);
      }
      .auth-btn {
        width: 100%;
        padding: 0.9rem;
        background: linear-gradient(135deg, #b30044, #ff4081);
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        margin-top: 0.5rem;
        font-family: "Inter", sans-serif;
      }
      .auth-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(179, 0, 68, 0.35);
      }
      .auth-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none;
      }
      .auth-error {
        color: #e60073;
        font-size: 0.83rem;
        text-align: center;
        margin-top: 0.6rem;
        min-height: 18px;
      }
      .auth-links {
        text-align: center;
        margin-top: 1.2rem;
        font-size: 0.88rem;
        color: #666;
      }
      .auth-links a {
        color: #e60073;
        text-decoration: none;
        font-weight: 600;
      }
      .auth-links a:hover {
        text-decoration: underline;
      }
      .auth-divider {
        border: none;
        border-top: 1px solid #f2c7d2;
        margin: 1.5rem 0 1rem;
      }
      .admin-link {
        text-align: center;
        font-size: 0.8rem;
        color: #aaa;
      }
      .admin-link a {
        color: #aaa;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header class="navbar">
      <div class="nav-top">
        <div class="logo">Sree Vastram</div>

        <div class="search-bar">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="searchInput"
            placeholder="Search for Products, Brands and More"
          />
        </div>

        <div class="nav-icons">
          <button class="cart" onclick="location.href = 'cart.html'">
            🛒 Cart
          </button>
          <button class="login btn" onclick="location.href = 'login.html'">
            Login
          </button>
          <div class="hamburger"><span></span><span></span><span></span></div>
        </div>
      </div>
      <div class="nav-bottom">
        <nav>
          <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="cotton.html">Cotton Suits</a></li>
            <li>
              <a href="stitched-cotton-suits.html">Stitched Cotton Suits</a>
            </li>
            <li><a href="saree.html">Sarees</a></li>
            <li><a href="homedecor.html">Home Decor</a></li>
            <li><a href="customised jeans.html">Customised Jeans</a></li>
            <li class="mobile-only"><a href="cart.html">🛒 Cart</a></li>
            <li class="mobile-only"><a href="login.html">Login</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <div class="auth-wrapper">
      <div class="auth-box">
        <div class="auth-brand">
          <h1>Sree Vastram</h1>
          <p>Premium Ethnic Wear &amp; Home Decor</p>
        </div>
        <h2 class="auth-title">Welcome Back 👋</h2>

        <form id="loginForm">
          <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <input
              type="email"
              id="loginEmail"
              placeholder="you@example.com"
              required
              autocomplete="email"
            />
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input
              type="password"
              id="loginPassword"
              placeholder="Your password"
              required
              autocomplete="current-password"
            />
          </div>

          <button type="submit" class="auth-btn" id="loginBtn">Sign In</button>
          <p class="auth-error" id="loginError"></p>
        </form>

        <div class="auth-links">
          Don't have an account? <a href="register.html">Register here</a>
        </div>

        <hr class="auth-divider" />
        <div class="admin-link">
          Store admin? <a href="admin/index.html">Admin Login →</a>
        </div>
      </div>
    </div>

    <script src="api.js"></script>
    <script>
      // Already logged in → redirect
      if (localStorage.getItem("customerToken")) {
        window.location.href = "profile.html";
      }

      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("loginEmail").value.trim();
          const password = document.getElementById("loginPassword").value;
          const btn = document.getElementById("loginBtn");
          const errEl = document.getElementById("loginError");

          btn.textContent = "Signing in…";
          btn.disabled = true;
          errEl.textContent = "";

          try {
            const data = await apiFetch("/customers/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });
            if (data.token) {
              localStorage.setItem("customerToken", data.token);
              localStorage.setItem(
                "customerInfo",
                JSON.stringify(data.customer),
              );
              // Redirect to where they came from, or home
              const redirect =
                new URLSearchParams(location.search).get("redirect") ||
                "index.html";
              window.location.href = redirect;
            } else {
              errEl.textContent =
                data.error || "Login failed. Please try again.";
              btn.textContent = "Sign In";
              btn.disabled = false;
            }
          } catch {
            errEl.textContent =
              "❌ Cannot connect to server. Make sure the backend is running.";
            btn.textContent = "Sign In";
            btn.disabled = false;
          }
        });
    </script>
  </body>
</html>
