<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — Sree Vastram</title>
    <meta
      name="description"
      content="Create your Sree Vastram account to start shopping premium ethnic wear."
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ga+Maamli&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script defer src="script.js"></script>
    <style>
      body {
        background: #fffafc;
        font-family: "Inter", sans-serif;
      }
      .auth-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 160px 16px 40px;
      }
      .auth-box {
        background: #fff;
        border-radius: 20px;
        padding: 2.5rem 2rem;
        width: 100%;
        max-width: 460px;
        box-shadow: 0 8px 40px rgba(179, 0, 89, 0.12);
        border: 1px solid #f2c7d2;
      }
      .auth-brand {
        text-align: center;
        margin-bottom: 1.5rem;
      }
      .auth-brand h1 {
        font-family: "Ga Maamli", sans-serif;
        font-size: 2rem;
        color: #e60073;
        margin-bottom: 0.2rem;
      }
      .auth-brand p {
        color: #999;
        font-size: 0.85rem;
      }
      .auth-title {
        text-align: center;
        font-size: 1.3rem;
        font-weight: 600;
        color: #222;
        margin-bottom: 1.5rem;
      }
      .form-group {
        margin-bottom: 1rem;
      }
      .form-group label {
        display: block;
        font-size: 0.83rem;
        font-weight: 500;
        color: #666;
        margin-bottom: 5px;
      }
      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid #e5b4c6;
        border-radius: 10px;
        font-size: 0.95rem;
        font-family: "Inter", sans-serif;
        outline: none;
        transition:
          border 0.3s,
          box-shadow 0.3s;
        box-sizing: border-box;
      }
      .form-group input:focus,
      .form-group textarea:focus {
        border-color: #e60073;
        box-shadow: 0 0 0 3px rgba(230, 0, 115, 0.1);
      }
      .form-group textarea {
        resize: vertical;
        min-height: 70px;
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
      }
      @media (max-width: 480px) {
        .form-row {
          grid-template-columns: 1fr;
        }
      }
      .auth-btn {
        width: 100%;
        padding: 0.9rem;
        background: linear-gradient(135deg, #b30044, #ff4081);
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        margin-top: 0.5rem;
        font-family: "Inter", sans-serif;
      }
      .auth-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(179, 0, 68, 0.35);
      }
      .auth-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none;
      }
      .auth-error {
        color: #e60073;
        font-size: 0.83rem;
        text-align: center;
        margin-top: 0.6rem;
        min-height: 18px;
      }
      .auth-links {
        text-align: center;
        margin-top: 1.2rem;
        font-size: 0.88rem;
        color: #666;
      }
      .auth-links a {
        color: #e60073;
        text-decoration: none;
        font-weight: 600;
      }
      .auth-links a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header class="navbar">
      <div class="nav-top">
        <div class="logo">Sree Vastram</div>

        <div class="search-bar">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="searchInput"
            placeholder="Search for Products, Brands and More"
          />
        </div>

        <div class="nav-icons">
          <button class="cart" onclick="location.href = 'cart.html'">
            🛒 Cart
          </button>
          <button class="login btn" onclick="location.href = 'login.html'">
            Login
          </button>
          <div class="hamburger"><span></span><span></span><span></span></div>
        </div>
      </div>
      <div class="nav-bottom">
        <nav>
          <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="cotton.html">Cotton Suits</a></li>
            <li>
              <a href="stitched-cotton-suits.html">Stitched Cotton Suits</a>
            </li>
            <li><a href="saree.html">Sarees</a></li>
            <li><a href="homedecor.html">Home Decor</a></li>
            <li><a href="customised jeans.html">Customised Jeans</a></li>
            <li class="mobile-only"><a href="cart.html">🛒 Cart</a></li>
            <li class="mobile-only"><a href="login.html">Login</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <div class="auth-wrapper">
      <div class="auth-box">
        <div class="auth-brand">
          <h1>Sree Vastram</h1>
          <p>Create your account to start shopping</p>
        </div>
        <h2 class="auth-title">Create Account ✨</h2>

        <form id="registerForm">
          <div class="form-group">
            <label for="regName">Full Name *</label>
            <input
              type="text"
              id="regName"
              placeholder="Your full name"
              required
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="regEmail">Email Address *</label>
              <input
                type="email"
                id="regEmail"
                placeholder="you@example.com"
                required
              />
            </div>
            <div class="form-group">
              <label for="regPhone">WhatsApp Number *</label>
              <input
                type="tel"
                id="regPhone"
                placeholder="9876543210"
                required
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="regPassword">Password *</label>
              <input
                type="password"
                id="regPassword"
                placeholder="Min 6 characters"
                required
                minlength="6"
              />
            </div>
            <div class="form-group">
              <label for="regConfirm">Confirm Password *</label>
              <input
                type="password"
                id="regConfirm"
                placeholder="Repeat password"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="regAddress">Delivery Address (optional)</label>
            <textarea
              id="regAddress"
              placeholder="Full address with pincode"
            ></textarea>
          </div>

          <button type="submit" class="auth-btn" id="registerBtn">
            Create Account
          </button>
          <p class="auth-error" id="registerError"></p>
        </form>

        <div class="auth-links">
          Already have an account? <a href="login.html">Sign in here</a>
        </div>
      </div>
    </div>

    <script src="api.js"></script>
    <script>
      // Already logged in → redirect
      if (localStorage.getItem("customerToken")) {
        window.location.href = "profile.html";
      }

      document
        .getElementById("registerForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const name = document.getElementById("regName").value.trim();
          const email = document.getElementById("regEmail").value.trim();
          const phone = document.getElementById("regPhone").value.trim();
          const password = document.getElementById("regPassword").value;
          const confirm = document.getElementById("regConfirm").value;
          const address = document.getElementById("regAddress").value.trim();
          const btn = document.getElementById("registerBtn");
          const errEl = document.getElementById("registerError");

          errEl.textContent = "";

          if (password !== confirm) {
            errEl.textContent = "Passwords do not match.";
            return;
          }
          if (password.length < 8) {
            errEl.textContent = "Password must be at least 8 characters.";
            return;
          }

          btn.textContent = "Creating account…";
          btn.disabled = true;

          try {
            const data = await apiFetch("/customers/register", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ name, email, phone, password, address }),
            });
            if (data.token) {
              localStorage.setItem("customerToken", data.token);
              localStorage.setItem(
                "customerInfo",
                JSON.stringify(data.customer),
              );
              window.location.href = "index.html";
            } else {
              errEl.textContent =
                data.error || "Registration failed. Please try again.";
              btn.textContent = "Create Account";
              btn.disabled = false;
            }
          } catch {
            errEl.textContent =
              "❌ Cannot connect to server. Make sure the backend is running.";
            btn.textContent = "Create Account";
            btn.disabled = false;
          }
        });
    </script>
  </body>
</html>
